name: e2e-upgrade

# Spec 121 and spec 191: the previous release's system is updated to this checkout, one environment at a time (tests/e2e/upgrade.sh),
# and "upgrade render check" compares the rendered manifests from the previous and the oldest supported release. The nightly run also
# updates from the oldest supported release; the Postgres 16 to 17 drill is e2e-upgrade-drill.yml. It is a workflow of its own because
# the e2e job uses about 75 of its 90 minutes. The release gate (scripts/release-check.py gate, workflow release-guard) looks for exactly
# two checks on the commit someone wants to tag: "upgrade render check" and "e2e upgrade (previous release → candidate)". This workflow only reads and tests: it never
# creates, moves or deletes a tag or a release.
on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'
  push:
    branches: [main]
    paths:
      - 'templates/gitops-app/**'
      - 'scripts/upgrade-render-check.py'
      - 'templates/gitops-app/scripts/render.py'
      - 'templates/gitops-app/scripts/local-cluster.sh'
      - 'scripts/cplat/upgrade*.py'
      - 'scripts/cplat/update.py'
      - 'scripts/cplat/versions.py'
      - 'scripts/release-check.py'
      - 'tests/e2e/upgrade.sh'
      - 'tests/e2e/lib/**'
      - '.github/workflows/e2e-upgrade.yml'
      - 'docs/CHANGELOG.md'
  pull_request:
    paths:
      - 'templates/gitops-app/**'
      - 'scripts/upgrade-render-check.py'
      - 'templates/gitops-app/scripts/render.py'
      - 'templates/gitops-app/scripts/local-cluster.sh'
      - 'scripts/cplat/upgrade*.py'
      - 'scripts/cplat/update.py'
      - 'scripts/cplat/versions.py'
      - 'scripts/release-check.py'
      - 'tests/e2e/upgrade.sh'
      - 'tests/e2e/lib/**'
      - '.github/workflows/e2e-upgrade.yml'
      - 'docs/CHANGELOG.md'

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run (main and the nightly run always complete).
concurrency:
  group: e2e-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    name: does this change need the upgrade e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.needs.outputs.run }}
      render: ${{ steps.needs.outputs.render }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release tags and the base of the comparison
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - id: needs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}   # a pull request decides on its own diff (spec 134); empty elsewhere: the latest tag
        run: uv run scripts/release-check.py needs-upgrade-e2e ${BASE:+--base "$BASE"} | tee -a "$GITHUB_OUTPUT"

  render:
    name: upgrade render check
    needs: decide
    if: needs.decide.outputs.render == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release tags the comparison starts from
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install copier
        run: uv tool install copier
      - name: Compare the renders from the previous and the oldest supported release
        run: uv run scripts/upgrade-render-check.py

  upgrade:
    name: e2e upgrade (previous release → candidate)
    needs: decide
    if: needs.decide.outputs.run == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45   # the platform update part only (spec 191); the drill is e2e-upgrade-drill.yml
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the previous release is a tag, checked out next to this commit
      - name: Log in to Docker Hub (anonymous pulls are rate-limited, #1045)
        if: env.DOCKERHUB_USERNAME != ''   # forks and a repo without the secrets build anonymously
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install copier and k3d
        run: |
          uv tool install copier
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - name: Run the upgrade end-to-end test
        run: bash tests/e2e/upgrade.sh

  upgrade-oldest:
    name: e2e upgrade (oldest supported release → candidate)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Log in to Docker Hub (anonymous pulls are rate-limited, #1045)
        if: env.DOCKERHUB_USERNAME != ''   # forks and a repo without the secrets build anonymously
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Choose the oldest supported release
        id: oldest
        run: |
          out=$(uv run scripts/release-check.py from-tag oldest)
          echo "$out"
          case "$out" in
            skipped:*) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT"; echo "tag=$out" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Install copier and k3d
        if: steps.oldest.outputs.skip == 'false'
        run: |
          uv tool install copier
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - name: Run the upgrade end-to-end test from the oldest supported release
        if: steps.oldest.outputs.skip == 'false'
        env:
          OLDEST: ${{ steps.oldest.outputs.tag }}
        run: E2E_UPGRADE_FROM="$OLDEST" bash tests/e2e/upgrade.sh
