name: e2e

# The whole chain without GitHub or a registry: render the repos from the real templates, build the images, start the
# platform's own local cluster, apply the generated manifests, probe the services through the Gateway (tests/e2e/run.sh).
# The second job renders a cluster repo with two systems and proves that one operator install serves both (tests/e2e/cluster.sh).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  pull_request:
    paths:
      - 'templates/gitops-app/**'
      - 'templates/cluster-gitops/**'
      - 'templates/service-*/Dockerfile*'
      - 'templates/web-nextjs/Dockerfile*'
      - 'scripts/cplat/**'
      - 'shapes.yml'
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'

# Least privilege by default; jobs that publish packages declare what they need.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run (the nightly run always completes).
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: e2e (render → build → k3d → Gateway)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'   # the service-java default; its smoke recipe runs mvn (preinstalled on the runner)
      - name: Install copier and k3d
        run: |
          uv tool install copier
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - name: Run the end-to-end test
        run: bash tests/e2e/run.sh

  e2e-cluster:
    name: e2e cluster (two systems, one operator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install copier and k3d
        run: |
          uv tool install copier
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - name: Run the cluster end-to-end test
        run: bash tests/e2e/cluster.sh
