# Keeps the dependency pins inside the Copier templates current (issue #56): Dependabot cannot read *.jinja manifests,
# so new projects would otherwise start with old versions. scripts/bump_template_pins.py renders each template, bumps
# the rendered manifest (minor/patch only) and copies the changes back; the pull request then runs the normal CI,
# whose smoke tests generate and build every template with the new versions.
#
# One-time setup: the default GITHUB_TOKEN may not be allowed to open pull requests, and pull requests it opens do not start CI.
# Preferred: a GitHub App installed on this repository with Contents + Pull requests: read/write; set the repository variable
# BUMP_APP_CLIENT_ID and the secret BUMP_APP_PRIVATE_KEY. Fallback: a secret BUMP_TOKEN (fine-grained token, same permissions).
# The job fails when it cannot open the pull request, so a bumped branch is never left behind unnoticed.
name: bump-template-pins

on:
  schedule:
    - cron: '0 5 * * 1'      # Mondays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bump-template-pins
  cancel-in-progress: false

jobs:
  bump:
    name: bump template pins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: GitHub App token
        id: app-token
        if: vars.BUMP_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || secrets.BUMP_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install copier
        run: uv tool install copier
      - name: Bump the pins
        run: uv run --with pyyaml --with ruamel.yaml scripts/bump_template_pins.py | tee "$RUNNER_TEMP/bump.log"
      - name: Open a pull request when something changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BUMP_TOKEN || github.token }}
          HAS_BUMP_TOKEN: ${{ steps.app-token.outputs.token != '' || secrets.BUMP_TOKEN != '' }}
        run: |
          if git diff --quiet; then echo "Everything is current."; exit 0; fi
          branch="chore/bump-template-pins-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A templates
          git commit -s -m "chore(deps): bump template dependency pins"
          git push -u origin "$branch"
          {
            echo "Automated by \`bump-template-pins\` (minor and patch versions only). Smoke tests build every template with the new pins."
            echo
            echo '```'
            cat "$RUNNER_TEMP/bump.log"
            echo '```'
            if [ "$HAS_BUMP_TOKEN" != "true" ]; then
              echo
              echo "Neither a GitHub App (BUMP_APP_CLIENT_ID) nor a BUMP_TOKEN secret is set, so CI did not start for this pull request: close and reopen it to run the checks."
            fi
          } > "$RUNNER_TEMP/body.md"
          if ! gh pr create --title "chore(deps): bump template dependency pins" --body-file "$RUNNER_TEMP/body.md"; then
            # the default token may not be allowed to open pull requests (repository setting); the branch is pushed
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            echo "::error::Could not open the pull request. Open it here: ${url}  (or set up the GitHub App or BUMP_TOKEN, see the top of this workflow)"
            echo "Pins bumped on branch \`${branch}\`. [Open the pull request](${url})." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
