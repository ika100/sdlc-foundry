name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]   # edited: a corrected title; labeled: no-spec (spec 082)

# Least privilege by default; jobs that publish packages declare what they need.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run (main and tags always run to completion).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && '-edited' || '' }}   # a title edit never cancels a running build
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide which expensive jobs a change needs. Pushes to main run everything; pull requests run what they touch.
  changes:
    name: detect what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      python: ${{ steps.diff.outputs.python }}
      gitops: ${{ steps.diff.outputs.gitops }}
      web: ${{ steps.diff.outputs.web }}
      go: ${{ steps.diff.outputs.go }}
      java: ${{ steps.diff.outputs.java }}
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            files=$'templates/\nscripts/\nshapes.yml\ntests/\nplugins/\n.github/workflows/ci.yml'
          else
            files=$(git diff --name-only "origin/${BASE}...HEAD")
          fi
          echo "changed files:"; awk '{print "  " $0}' <<< "$files"
          has() { if grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi; }
          # anything that is not documentation or repository metadata can break the tested code
          code=$(grep -Evq '^(docs/|.*\.md$|LICENSE$|NOTICE$|\.github/(ISSUE_TEMPLATE/|CODEOWNERS|PULL_REQUEST_TEMPLATE|dependabot))' <<< "$files" && echo true || echo false)
          shared=$(has '^(scripts/|shapes\.yml$|\.github/workflows/ci\.yml$|tests/fixtures/)')
          t() { if [ "$shared" = true ] || [ "$(has "$1")" = true ]; then echo true; else echo false; fi; }
          {
            echo "code=$code"
            echo "python=$(t '^templates/(service-python|library-python)/')"
            echo "gitops=$(t '^templates/gitops-app/')"
            echo "web=$(t '^templates/web-nextjs/')"
            echo "go=$(t '^templates/service-go/')"
            echo "java=$(t '^templates/service-java/')"
            echo "site=$(has '^(site/|docs/|plugins/|shapes\.yml$|scripts/cplat/|templates/gitops-app/scripts/(render\.py|local-cluster\.sh)$|[A-Z_]+\.md$|\.github/workflows/(ci|pages)\.yml$)')"
          } | tee -a "$GITHUB_OUTPUT"

  validate-manifests:
    name: validate marketplace.json + plugin.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: jq installed?
        run: jq --version
      - name: marketplace.json is valid JSON
        run: jq -e . .claude-plugin/marketplace.json
      - name: every plugin.json is valid JSON
        run: |
          set -e
          for f in plugins/*/.claude-plugin/plugin.json; do
            echo "Checking $f"
            jq -e . "$f"
          done
      - name: plugin versions match marketplace catalog
        run: |
          set -e
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            plugin_version=$(jq -r .version "$plugin_dir.claude-plugin/plugin.json")
            catalog_version=$(jq -r ".plugins[] | select(.name == \"$plugin_name\") | .version" .claude-plugin/marketplace.json)
            if [ "$plugin_version" != "$catalog_version" ]; then
              echo "Version mismatch for $plugin_name: plugin.json=$plugin_version, marketplace.json=$catalog_version"
              exit 1
            fi
            echo "OK $plugin_name @ $plugin_version"
          done

  validate-shapes:
    name: shape registry + detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: shapes.yml is valid and consistent with templates, plugins and the PRD table
        run: uv run scripts/shapes.py check
      - name: shape detection fixtures
        run: bash scripts/test-detect-shape.sh
      - name: relative Markdown links resolve
        run: python3 scripts/check-links.py
      - name: every file has license and copyright metadata (REUSE)
        run: uvx --from "reuse[charset-normalizer]" reuse lint
      - name: actions are pinned by commit SHA and workflows declare least-privilege permissions
        run: python3 scripts/pin-actions.py --check
      - name: workflows (platform + every generated repo) pass actionlint
        run: |
          uv tool install copier
          for t in service-python library-python service-java service-go web-nextjs gitops-app; do
            copier copy ./templates/$t /tmp/lint-$t --defaults --trust --skip-tasks --data project_name=lint-test
          done
          uv tool run --from actionlint-py actionlint .github/workflows/*.yml /tmp/lint-*/.github/workflows/*.yml
      - name: generated Kubernetes manifests are valid (labels, kustomize build, kubeconform)
        run: |
          uv tool install copier
          copier copy ./templates/gitops-app /tmp/v2 --defaults --trust --skip-tasks --data project_name=fx-gitops --data app_name=fx
          cp tests/fixtures/gitops/services.yaml /tmp/v2/applications/fx/services.yaml
          cp tests/fixtures/gitops/app.yaml /tmp/v2/applications/fx/app.yaml
          (cd /tmp/v2 && uv run scripts/render.py)
          # what `/gitops:promote` does: staging/prod run pinned tags, never :latest (the guard rails below require it)
          sed -i 's/newTag: latest/newTag: sha-1234567/' /tmp/v2/applications/fx/overlays/staging/*/kustomization.yaml
          (cd /tmp/v2 && uv run scripts/render.py --check)
          uv run scripts/check-k8s-labels.py /tmp/v2
          for d in /tmp/v2/applications/fx/overlays/*/*/ /tmp/v2/applications/fx/addons/*/*/; do kubectl kustomize "$d" > /dev/null; done
      - name: Install the Kyverno CLI (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/kyverno-cli.tgz https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz
          echo "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae  /tmp/kyverno-cli.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/kyverno-cli.tgz -C "$HOME/.local/bin" kyverno
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: rendered manifests satisfy the Kyverno guard rails (offline)
        run: bash /tmp/v2/scripts/check-policies.sh


  platform-tests:
    name: cplat unit + integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install copier
        run: uv tool install copier
      - name: Install the Kyverno CLI (pinned, checksum-verified)
        run: |
          curl -fsSL -o /tmp/kyverno-cli.tgz https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz
          echo "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae  /tmp/kyverno-cli.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/kyverno-cli.tgz -C "$HOME/.local/bin" kyverno
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: pytest
        run: uv run --with pytest --with pytest-xdist --with pyyaml --with ruamel.yaml pytest tests/cplat -q -n auto

  smoke-test-templates:
    name: smoke-test Copier templates
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # spec 084: independent variants; one flaky job must not cancel the rest
      matrix:
        template: [service-python, library-python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install copier
        run: uv tool install copier
      - name: Generate test project
        # --skip-tasks: CI verifies template rendering only. The bootstrap _tasks
        # invoke devbox, which isn't installed on the runner; the full
        # render-and-bootstrap path is covered by `devbox run smoke` locally.
        run: |
          copier copy ./templates/${{ matrix.template }} /tmp/test-${{ matrix.template }} \
            --defaults \
            --trust \
            --skip-tasks \
            --data project_name=test-${{ matrix.template }} \
            --data module_name=test_${{ matrix.template == 'service-python' && 'svc' || 'lib' }} \
            --data description="Smoke test"
      - name: Confirm key files exist
        run: |
          test -f /tmp/test-${{ matrix.template }}/devbox.json
          test -f /tmp/test-${{ matrix.template }}/pyproject.toml
          test -f /tmp/test-${{ matrix.template }}/.claude/settings.json
          test -f /tmp/test-${{ matrix.template }}/.github/workflows/ci.yml
      - name: Confirm devbox.json mentions the templated module name
        run: |
          if [ "${{ matrix.template }}" = "service-python" ]; then
            grep -F -e '--cov=test_svc' /tmp/test-${{ matrix.template }}/devbox.json
          else
            grep -F -e '--cov=test_lib' /tmp/test-${{ matrix.template }}/devbox.json
          fi
      # Spec 043: a generated repo must pass its own quality gate. uv only (no devbox on the runner);
      # `devbox run smoke` stays the full local check of the render-and-bootstrap path.
      - name: Lint, type-check and test the rendered project
        working-directory: /tmp/test-${{ matrix.template }}
        run: |
          uv sync --all-extras
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          if [ "${{ matrix.template }}" = "service-python" ]; then
            SMOKE_BASE_URL='' uv run python -m pytest tests/ -p scripts.smoke_pytest -q -rs | tee /tmp/pytest.out
            grep -q "SMOKE_BASE_URL is not set" /tmp/pytest.out   # spec 091: the example smoke test is skipped here
          else
            uv run pytest -q
          fi
      # Spec 091: the real smoke runner against a running instance of the service
      - name: Smoke tests against a running service
        if: matrix.template == 'service-python'
        working-directory: /tmp/test-service-python
        run: |
          set +e
          bash scripts/smoke.sh 2>/tmp/guard.err; rc=$?
          set -e
          test "$rc" = 2 && grep -q SMOKE_BASE_URL /tmp/guard.err
          uv run uvicorn test_svc.main:app --port 18080 &
          for _ in $(seq 1 30); do curl -sf localhost:18080/health && break; sleep 1; done
          SMOKE_BASE_URL=http://127.0.0.1:18080 bash scripts/smoke.sh | tee /tmp/smoke.out
          grep -qx "smoke: 1 passed, 0 failed, 0 skipped" /tmp/smoke.out

  smoke-test-gitops-app:
    name: smoke-test gitops-app template
    needs: changes
    if: needs.changes.outputs.gitops == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install copier
        run: uv tool install copier
      - name: Generate test project
        run: |
          copier copy ./templates/gitops-app /tmp/test-gitops --defaults --trust --skip-tasks \
            --data project_name=test-gitops --data app_name=test --data description="Smoke test"
      - name: Confirm key files exist
        run: |
          test -f /tmp/test-gitops/devbox.json
          test -f /tmp/test-gitops/.claude/settings.json
          test -f /tmp/test-gitops/applications/test/services.yaml
          test -f /tmp/test-gitops/applications/test/applicationset.yaml
          test -d /tmp/test-gitops/applications/test/overlays/dev
          test -d /tmp/test-gitops/applications/test/overlays/staging
          test -d /tmp/test-gitops/applications/test/overlays/prod
          test -f /tmp/test-gitops/bootstrap/test-root.yaml
      - name: Shape is detected as gitops-app
        run: test "$(bash scripts/detect-shape.sh /tmp/test-gitops)" = "gitops-app"
      - name: Rendered files are in sync and a v2 fixture renders manifests only for its environments
        run: |
          cd /tmp/test-gitops
          uv run scripts/render.py --check
          cp "$GITHUB_WORKSPACE/tests/fixtures/gitops/services.yaml" applications/test/services.yaml
          cp "$GITHUB_WORKSPACE/tests/fixtures/gitops/app.yaml" applications/test/app.yaml
          uv run scripts/render.py
          uv run scripts/render.py --check
          test -f applications/test/overlays/dev/fx-api/deployment.yaml
          test -f applications/test/overlays/staging/fx-api/deployment.yaml
          test ! -e applications/test/overlays/prod/fx-api      # not promoted to prod
          test -f applications/test/overlays/dev/fx-web/httproute.yaml
          grep -F 'fx-api' applications/test/applicationset.yaml
      - name: local cluster script parses and the recipes exist
        run: |
          bash -n /tmp/test-gitops/scripts/local-cluster.sh
          jq -e '.shell.scripts | has("cluster-up") and has("cluster-down") and has("bootstrap")' /tmp/test-gitops/devbox.json
      - name: plan.py tests (ADR-011 validation, topo order, lifecycle)
        run: bash scripts/test-plan.sh
      - name: kustomize + kubeconform on the ApplicationSet
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /tmp kubeconform
          /tmp/kubeconform -strict -ignore-missing-schemas -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -summary /tmp/test-gitops/applications/test/applicationset.yaml /tmp/test-gitops/bootstrap/test-root.yaml /tmp/test-gitops/applications/test/overlays/*/*/[dsh]*.yaml

  smoke-test-web-nextjs:
    name: smoke-test web-nextjs template
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install copier
        run: uv tool install copier
      - name: Generate test project (defaults)
        run: |
          copier copy ./templates/web-nextjs /tmp/test-web --defaults --trust --skip-tasks \
            --data project_name=test-web --data description="Smoke test"
      - name: Confirm key files exist
        run: |
          for f in devbox.json package.json Dockerfile .claude/settings.json .github/workflows/ci.yml \
                   app/layout.tsx app/page.tsx app/api/health/route.ts app/api/ready/route.ts \
                   app/api/metrics/route.ts instrumentation.ts pnpm-workspace.yaml; do
            test -f /tmp/test-web/$f || { echo "missing $f"; exit 1; }
          done
          test ! -e /tmp/test-web/k8s || { echo "service templates must not ship k8s/ (ADR-017)"; exit 1; }
          test -f /tmp/test-web/e2e/smoke.spec.ts
          test -f /tmp/test-web/playwright.config.ts
      - name: Shape is detected as web-nextjs
        run: test "$(bash scripts/detect-shape.sh /tmp/test-web)" = "web-nextjs"
      - name: Install, lint, typecheck, test, build
        working-directory: /tmp/test-web
        run: |
          npx -y pnpm@11.22.0 install
          npx -y pnpm@11.22.0 lint
          npx -y pnpm@11.22.0 typecheck
          npx -y pnpm@11.22.0 test
          npx -y pnpm@11.22.0 build
      - name: image builds and starts (non-root, read-only root filesystem)
        working-directory: /tmp/test-web
        run: |
          docker build -t smoke:web .
          docker run -d --name smoke --read-only --tmpfs /tmp --tmpfs /app/.next/cache -p 3000:3000 smoke:web
          up=false
          for _ in $(seq 1 30); do curl -sf localhost:3000/api/health && { up=true; break; }; sleep 2; done
          $up || { docker logs smoke; exit 1; }
          # spec 091: the browser smoke tests against the running image
          SMOKE_BASE_URL=http://localhost:3000 bash scripts/smoke.sh | tee /tmp/smoke.out
          grep -qx "smoke: 1 passed, 0 failed, 0 skipped" /tmp/smoke.out
      - name: Variant — observability off
        run: |
          copier copy ./templates/web-nextjs /tmp/test-web2 --defaults --trust --skip-tasks \
            --data project_name=test-web2 --data needs_observability=false
          test -f /tmp/test-web2/e2e/smoke.spec.ts
          test -f /tmp/test-web2/playwright.config.ts
          test ! -e /tmp/test-web2/instrumentation.ts
          test ! -e /tmp/test-web2/app/api/metrics
          test ! -e /tmp/test-web2/tests/metrics.test.ts
          grep -q '"@playwright/test"' /tmp/test-web2/package.json
          ! grep -q 'prom-client' /tmp/test-web2/package.json

  smoke-test-service-go:
    name: smoke-test service-go template
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # spec 084: independent variants; one flaky job must not cancel the rest
      matrix:
        observability: [true, false]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - name: Install copier
        run: uv tool install copier
      - name: Generate test project
        run: |
          copier copy ./templates/service-go /tmp/test-go --defaults --trust --skip-tasks \
            --data project_name=test-go --data needs_observability=${{ matrix.observability }}
      - name: Confirm key files exist
        run: |
          for f in devbox.json go.mod go.sum Dockerfile .golangci.yml .claude/settings.json .github/workflows/ci.yml \
                   cmd/test-go/main.go internal/server/server.go internal/config/config.go; do
            test -f /tmp/test-go/$f || { echo "missing $f"; exit 1; }
          done
          test ! -e /tmp/test-go/k8s || { echo "service templates must not ship k8s/ (ADR-017)"; exit 1; }
      - name: Shape is detected as service-go
        run: test "$(bash scripts/detect-shape.sh /tmp/test-go)" = "service-go"
      - name: go.mod / go.sum are tidy
        working-directory: /tmp/test-go
        run: |
          git init -q && git add -A && git -c user.email=ci@x -c user.name=ci commit -qm init
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: vet, gofmt, build, test
        working-directory: /tmp/test-go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test -race -cover ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: /tmp/test-go
          version: latest
      - name: image builds and starts (non-root, read-only root filesystem)
        working-directory: /tmp/test-go
        run: |
          docker build --build-arg VERSION=v0.0.0 -t smoke:go .
          docker run -d --name smoke --read-only -p 8080:8080 smoke:go
          up=false
          for _ in $(seq 1 20); do curl -sf localhost:8080/health && { up=true; break; }; sleep 2; done
          $up || { docker logs smoke; exit 1; }
          # spec 091: the smoke tests against the running image
          SMOKE_BASE_URL=http://localhost:8080 bash scripts/smoke.sh | tee /tmp/smoke.out
          grep -qx "smoke: 1 passed, 0 failed, 0 skipped" /tmp/smoke.out

  smoke-test-service-java:
    name: smoke-test service-java template (obs=${{ matrix.observability }}, db=${{ matrix.database }})
    needs: changes
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Daether.connector.http.retryHandler.count=3   # spec 084: a dropped download is retried, not a red job
    strategy:
      fail-fast: false   # spec 084: independent variants; one flaky job must not cancel the rest
      matrix:
        include:
          - {observability: true, database: false}
          - {observability: false, database: false}
          - {observability: true, database: true}     # PostgreSQL support: JPA, Flyway, Testcontainers tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install copier
        run: uv tool install copier
      - name: Generate test project
        run: |
          copier copy ./templates/service-java /tmp/test-java --defaults --trust --skip-tasks \
            --data project_name=test-java --data needs_observability=${{ matrix.observability }} --data needs_database=${{ matrix.database }}
      - name: Confirm key files exist
        run: |
          for f in devbox.json pom.xml Dockerfile config/checkstyle.xml .claude/settings.json .github/workflows/ci.yml \
                   src/main/resources/application.yml; do
            test -f /tmp/test-java/$f || { echo "missing $f"; exit 1; }
          done
          test ! -e /tmp/test-java/k8s || { echo "service templates must not ship k8s/ (ADR-017)"; exit 1; }
          test -f /tmp/test-java/src/main/java/io/github/ika100/testjava/Application.java
      - name: Shape is detected as service-java
        run: test "$(bash scripts/detect-shape.sh /tmp/test-java)" = "service-java"
      - name: spotless + checkstyle (lint)
        working-directory: /tmp/test-java
        run: mvn -B -q spotless:check checkstyle:check
      - name: verify (tests + JaCoCo 80% gate)
        working-directory: /tmp/test-java
        run: mvn -B verify
      - name: image builds and starts (non-root, read-only root filesystem)
        working-directory: /tmp/test-java
        run: |
          docker build -t smoke:java .
          db_env=""
          if [ "${{ matrix.database }}" = true ]; then
            # readiness includes the database: give the image a real PostgreSQL, wired like the platform's postgres addon does
            docker network create smoke-net
            docker run -d --name smoke-db --network smoke-net -e POSTGRES_USER=app -e POSTGRES_PASSWORD=dev -e POSTGRES_DB=test_java postgres:17
            for _ in $(seq 1 30); do docker exec smoke-db pg_isready -U app -d test_java && break; sleep 2; done
            db_env="--network smoke-net -e PGHOST=smoke-db -e PGPORT=5432 -e PGDATABASE=test_java -e PGUSER=app -e PGPASSWORD=dev"
          fi
          # shellcheck disable=SC2086
          docker run -d --name smoke --read-only --tmpfs /tmp -p 8080:8080 -e OTEL_SDK_DISABLED=true $db_env smoke:java
          up=false
          for _ in $(seq 1 40); do curl -sf localhost:8080/actuator/health/readiness && { up=true; break; }; sleep 3; done
          $up || { docker logs smoke; exit 1; }
          # spec 091: the smoke tests against the running image
          SMOKE_BASE_URL=http://localhost:8080 bash scripts/smoke.sh | tee /tmp/smoke.out
          grep -qx "smoke: 1 passed, 0 failed, 0 skipped" /tmp/smoke.out

  site:
    name: documentation site builds
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies (no install scripts)
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Unit tests of the docs sync
        working-directory: site
        run: npm test
      - name: Build the site (fails on a broken internal link)
        working-directory: site
        run: npm run build

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every commit of the pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-dco.py

  spec-required:
    name: spec-required (platform changes start with a spec)
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: a PR that closes an issue and changes the platform has a spec, or the no-spec label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 scripts/check-spec-required.py

  pr-title:
    name: pr-title (conventional commits)
    runs-on: ubuntu-latest
    # Dependabot's grouped titles ("bump the all group across 1 directory with N updates") exceed the subject limit
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?!?: .{1,72}$'
          if ! echo "$PR_TITLE" | grep -qE "$pattern"; then
            echo "ERROR: PR title does not follow Conventional Commits."
            echo "  Got:     $PR_TITLE"
            echo "  Pattern: type(scope): description (≤72 chars)"
            exit 1
          fi
          echo "OK: PR title is valid."

  # The single status required by branch protection. Jobs skipped by `changes` count as passed; a failed or cancelled job fails it.
  ci-success:
    name: ci-success
    if: always()
    needs: [changes, validate-manifests, validate-shapes, platform-tests, smoke-test-templates, smoke-test-gitops-app, smoke-test-web-nextjs, smoke-test-service-go, smoke-test-service-java, site, dco, spec-required, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if echo "$NEEDS" | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' >/dev/null; then
            echo "ERROR: a required job failed or was cancelled" >&2
            exit 1
          fi
