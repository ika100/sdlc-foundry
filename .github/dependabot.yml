# Monthly, grouped dependency PRs (security updates still arrive immediately and separately): the language ecosystem, the
# GitHub Actions used by CI (pinned by commit SHA; Dependabot updates the SHA and the version comment), and Docker base images.
version: 2
updates:
  - package-ecosystem: github-actions
    # the platform and every template in one grouped PR, so their pins never diverge (spec 055)
    directories: ["/", "/templates/service-python", "/templates/library-python", "/templates/web-nextjs",
                  "/templates/service-java", "/templates/service-go", "/templates/gitops-app", "/templates/cluster-gitops"]
    schedule: {interval: monthly}
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/site"
    schedule: {interval: monthly}
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
