name: Idea or feedback
description: Something that would make the platform better
labels: [triage, feedback, enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What are you trying to do, and what would help?
    validations: {required: true}
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Shape (service-python, web-nextjs, ...), what you do today instead.
