<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img">
  <title>The todo system. On the left its parts: the todo-web website calls the todo-api service&#x27;s API, and todo-api uses a postgres database. On the right three environments, dev, staging and prod, each promoting to the next. Every part runs as one instance per environment, showing its version and state; todo-web is not yet in prod. Below, a Spec is shipped by a Run, which lands in dev.</title>
  <style>svg{--bg:#ffffff;--surface:#ffffff;--fg:#1d2330;--muted:#5b6475;--line:#d5d9e2;--accent:#3d4fc4;--accent-soft:#eceefc;--ok:#2f7d4f;--warn:#a3580b;--warn-soft:#fbefe1;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--fg)}@media (prefers-color-scheme: dark){svg{--bg:#1a1e28;--surface:#1a1e28;--fg:#e4e7ee;--muted:#9aa2b3;--line:#2f3545;--accent:#9aa6ff;--accent-soft:#232945;--ok:#6fcf97;--warn:#e8a85c;--warn-soft:#3a2a17;}}text{font-family:var(--sans)}.bg{fill:var(--bg)}.band { fill: none; stroke: var(--line); stroke-width: 1.4; }.band.acc { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 6 4; }.node.ext { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }.node.core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }.node.gate { stroke-width: 3; }.pill { font-size: 13px; fill: currentColor; }.rowname { font-size: 14px; font-weight: 600; fill: currentColor; }.node { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }.node.env { fill: var(--accent-soft); stroke: var(--accent); }.node.inst { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; }.node.empty { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }.chip { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }.edge { fill: none; stroke: currentColor; stroke-width: 1.4; }.edge.acc { stroke: var(--accent); }.edge.m { stroke: var(--muted); stroke-dasharray: 4 4; }.kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; fill: var(--muted); }.kind.acc { fill: var(--accent); }.name { font-size: 15px; font-weight: 600; fill: currentColor; }.big { font-size: 18px; font-weight: 600; fill: currentColor; }.sha { font-family: var(--mono); font-size: 14px; font-weight: 500; fill: currentColor; }.src { font-family: var(--mono); font-size: 11px; fill: var(--muted); }.okt { font-family: var(--mono); font-size: 11px; fill: var(--ok); }.lbl { font-size: 12px; fill: currentColor; }.lbl.m { fill: var(--muted); }.lbl.acc { fill: var(--accent); font-weight: 500; }.arrow { fill: currentColor; }.arrow.acc { fill: var(--accent); }.arrow.m { fill: var(--muted); }</style>
  <rect class="bg" x="0" y="0" width="1000" height="590"/>
      <defs>
        <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
        <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow acc"/></marker>
        <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow m"/></marker>
      </defs>

      <!-- System -->
      <rect x="20" y="20" width="960" height="420" rx="14" class="band"/>
      <text x="40" y="48" class="kind">SYSTEM</text>
      <text x="98" y="49" class="big">todo</text>
      <rect x="836" y="30" width="128" height="26" rx="13" class="chip"/>
      <text x="900" y="47" text-anchor="middle" class="src">owner: team-todo</text>

      <text x="40" y="84" class="kind">PARTS · WHAT YOU BUILD AND USE</text>
      <text x="380" y="84" class="kind acc">ENVIRONMENTS · WHERE IT RUNS</text>

      <!-- Environment headers -->
      <rect x="380" y="96" width="170" height="54" rx="8" class="node env"/>
      <text x="392" y="118" class="name">dev</text>
      <text x="392" y="138" class="src">follows main</text>
      <rect x="590" y="96" width="170" height="54" rx="8" class="node env"/>
      <text x="602" y="118" class="name">staging</text>
      <text x="602" y="138" class="src">after green dev smoke</text>
      <rect x="800" y="96" width="170" height="54" rx="8" class="node env"/>
      <text x="812" y="118" class="name">prod</text>
      <text x="812" y="138" class="src">you promote by hand</text>
      <line x1="550" y1="123" x2="588" y2="123" class="edge acc" marker-end="url(#aa)"/>
      <line x1="760" y1="123" x2="798" y2="123" class="edge acc" marker-end="url(#aa)"/>
      <text x="780" y="84" text-anchor="middle" class="lbl acc">promotes to →</text>

      <!-- Parts -->
      <rect x="40" y="170" width="280" height="64" rx="8" class="node"/>
      <text x="52" y="188" class="kind">COMPONENT · WEBSITE</text>
      <text x="52" y="208" class="name">todo-web</text>
      <text x="52" y="225" class="src">typescript · repo ika100/todo-web</text>

      <rect x="40" y="260" width="280" height="64" rx="8" class="node"/>
      <text x="52" y="278" class="kind">COMPONENT · SERVICE</text>
      <text x="52" y="298" class="name">todo-api</text>
      <text x="52" y="315" class="src">python · provides todo-api REST</text>

      <rect x="40" y="350" width="280" height="64" rx="8" class="node"/>
      <text x="52" y="368" class="kind">RESOURCE · DATABASE</text>
      <text x="52" y="388" class="name">postgres</text>
      <text x="52" y="405" class="src">v17 · run by the platform</text>

      <line x1="180" y1="234" x2="180" y2="258" class="edge" marker-end="url(#a)"/>
      <text x="190" y="250" class="lbl">calls its API</text>
      <line x1="180" y1="324" x2="180" y2="348" class="edge" marker-end="url(#a)"/>
      <text x="190" y="340" class="lbl">uses</text>

      <!-- runs as -->
      <line x1="320" y1="202" x2="378" y2="202" class="edge m" marker-end="url(#am)"/>
      <text x="349" y="194" text-anchor="middle" class="lbl m">runs as</text>
      <line x1="320" y1="292" x2="378" y2="292" class="edge m" marker-end="url(#am)"/>
      <line x1="320" y1="382" x2="378" y2="382" class="edge m" marker-end="url(#am)"/>

      <!-- Instances: todo-web -->
      <rect x="380" y="170" width="170" height="64" rx="8" class="node inst"/>
      <text x="392" y="186" class="kind acc">INSTANCE</text>
      <text x="392" y="206" class="sha">8a1e2c0</text>
      <text x="392" y="224" class="okt">healthy · smoke ok</text>
      <rect x="590" y="170" width="170" height="64" rx="8" class="node inst"/>
      <text x="602" y="186" class="kind acc">INSTANCE</text>
      <text x="602" y="206" class="sha">8a1e2c0</text>
      <text x="602" y="224" class="okt">healthy · smoke ok</text>
      <rect x="800" y="170" width="170" height="64" rx="8" class="node empty"/>
      <text x="885" y="207" text-anchor="middle" class="lbl m">not promoted yet</text>

      <!-- Instances: todo-api -->
      <rect x="380" y="260" width="170" height="64" rx="8" class="node inst"/>
      <text x="392" y="276" class="kind acc">INSTANCE</text>
      <text x="392" y="296" class="sha">41c07fd</text>
      <text x="392" y="314" class="okt">healthy · smoke ok</text>
      <rect x="590" y="260" width="170" height="64" rx="8" class="node inst"/>
      <text x="602" y="276" class="kind acc">INSTANCE</text>
      <text x="602" y="296" class="sha">3f9c2e1</text>
      <text x="602" y="314" class="okt">healthy · smoke ok</text>
      <rect x="800" y="260" width="170" height="64" rx="8" class="node inst"/>
      <text x="812" y="276" class="kind acc">INSTANCE</text>
      <text x="812" y="296" class="sha">3f9c2e1</text>
      <text x="812" y="314" class="okt">healthy</text>

      <!-- Instances: postgres -->
      <rect x="380" y="350" width="170" height="64" rx="8" class="node inst"/>
      <text x="392" y="366" class="kind acc">RESOURCE INSTANCE</text>
      <text x="392" y="386" class="sha">1 × 1Gi</text>
      <text x="392" y="404" class="okt">ready</text>
      <rect x="590" y="350" width="170" height="64" rx="8" class="node inst"/>
      <text x="602" y="366" class="kind acc">RESOURCE INSTANCE</text>
      <text x="602" y="386" class="sha">1 × 1Gi</text>
      <text x="602" y="404" class="okt">ready</text>
      <rect x="800" y="350" width="170" height="64" rx="8" class="node inst"/>
      <text x="812" y="366" class="kind acc">RESOURCE INSTANCE</text>
      <text x="812" y="386" class="sha">3 × 20Gi</text>
      <text x="812" y="404" class="okt">ready</text>

      <!-- Work -->
      <text x="40" y="478" class="kind">WORK · HOW IT CHANGES</text>
      <rect x="40" y="496" width="280" height="64" rx="8" class="node"/>
      <text x="52" y="520" class="name">Spec</text>
      <text x="52" y="540" class="src">what should change, for the</text>
      <text x="52" y="554" class="src">system or one component</text>
      <rect x="380" y="496" width="280" height="64" rx="8" class="node"/>
      <text x="392" y="520" class="name">Run</text>
      <text x="392" y="540" class="src">an agent builds, tests and</text>
      <text x="392" y="554" class="src">ships it, within a budget</text>
      <line x1="320" y1="528" x2="378" y2="528" class="edge" marker-end="url(#a)"/>
      <text x="349" y="520" text-anchor="middle" class="lbl">ship</text>
      <line x1="465" y1="496" x2="465" y2="442" class="edge acc" marker-end="url(#aa)"/>
      <text x="475" y="474" class="lbl acc">lands in dev</text>
    </svg>
