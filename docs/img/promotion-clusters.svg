<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img">
  <title>A platform update reaches the cluster repo, the first cluster local takes it, the later cluster home stays on its old release until a person runs cluster promote, which is gated on healthy operators and green smoke tests on local.</title>
  <style>svg{--bg:#ffffff;--surface:#ffffff;--fg:#1d2330;--muted:#5b6475;--line:#d5d9e2;--frame:#f4f5f9;--cell:#f7f8fb;--accent:#3d4fc4;--accent-soft:#eceefc;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--fg)}@media (prefers-color-scheme: dark){svg{--bg:#1a1e28;--surface:#1a1e28;--fg:#e4e7ee;--muted:#9aa2b3;--line:#2f3545;--frame:#1f2430;--cell:#222836;--accent:#9aa6ff;--accent-soft:#232945;}}text{font-family:var(--sans)}.bg{fill:var(--bg)}.frame{fill:var(--frame);stroke:var(--line);stroke-dasharray:5 4}.box{fill:var(--surface);stroke:var(--line)}.cell{fill:var(--cell);stroke:var(--line)}.cell-prod{fill:var(--accent-soft);stroke:var(--accent)}.t{fill:var(--fg);font-size:13px;font-weight:500}.tb{fill:var(--fg);font-size:14px;font-weight:600}.ts{fill:var(--muted);font-size:11.5px}.tm{fill:var(--fg);font-family:var(--mono);font-size:12.5px;font-weight:500}.tms{fill:var(--muted);font-family:var(--mono);font-size:11px}.ta{fill:var(--accent);font-size:12.5px;font-weight:600}.tam{fill:var(--accent);font-family:var(--mono);font-size:12px;font-weight:500}.edge{stroke:var(--fg);stroke-width:1.4;fill:none}.edge-dash{stroke:var(--muted);stroke-width:1.4;fill:none;stroke-dasharray:4 4}.edge-acc{stroke:var(--accent);stroke-width:2.4;fill:none}.badge{fill:var(--surface);stroke:var(--fg);stroke-width:1.2}.badge-acc{fill:var(--accent);stroke:var(--accent)}.badge-t{fill:var(--fg);font-size:11px;font-weight:600}.badge-ta{fill:var(--bg);font-size:11px;font-weight:600}.ah{fill:var(--fg)}.ah-acc{fill:var(--accent)}.ah-m{fill:var(--muted)}</style>
  <rect class="bg" x="0" y="0" width="960" height="250"/>
        <defs>
          <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
          <marker id="a2m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-m" d="M0 0L10 5L0 10z"/></marker>
          <marker id="a2acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-acc" d="M0 0L10 5L0 10z"/></marker>
        </defs>

        <rect class="box" x="20" y="95" width="180" height="60" rx="6"/>
        <text class="t" x="32" y="119">platform 5.22</text><text class="tms" x="32" y="139">/platform:update</text>

        <rect class="box" x="270" y="80" width="210" height="90" rx="6"/>
        <text class="t" x="282" y="104">cluster repo</text>
        <text class="tms" x="282" y="124">clusters: [local, home]</text>
        <text class="ts" x="282" y="144">operators, secret store</text>
        <text class="ts" x="282" y="160">defined once for both</text>

        <rect class="box" x="580" y="20" width="200" height="70" rx="6"/>
        <text class="t" x="592" y="44">cluster local</text>
        <text class="tm" x="592" y="64">operators @ 5.22</text>
        <text class="ts" x="592" y="81">runs todo dev · staging</text>

        <rect class="cell-prod" x="580" y="160" width="200" height="70" rx="6"/>
        <text class="t" x="592" y="184">cluster home</text>
        <text class="tm" x="592" y="204">operators @ 5.21</text><text class="tam" x="720" y="204">BEHIND</text>
        <text class="ts" x="592" y="221">runs todo prod</text>

        <line class="edge" x1="200" y1="125" x2="268" y2="125" marker-end="url(#a2)"/>
        <text class="ts" x="234" y="117" text-anchor="middle">PR merges</text>

        <line class="edge" x1="480" y1="105" x2="578" y2="60" marker-end="url(#a2)"/>
        <text class="ts" x="524" y="106">first cluster</text><text class="ts" x="524" y="120">takes it</text>

        <line class="edge-dash" x1="480" y1="145" x2="578" y2="190" marker-end="url(#a2m)"/>
        <text class="ts" x="500" y="186">tree stays</text><text class="ts" x="500" y="200">byte for byte</text>

        <line class="edge-acc" x1="680" y1="92" x2="680" y2="157" marker-end="url(#a2acc)"/>
        <text class="ta" x="694" y="114">/cluster:promote home</text>
        <text class="ts" x="694" y="131">gate: local operators Synced Healthy</text>
        <text class="ts" x="694" y="146">+ component smoke green on local</text>
      </svg>
