<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img">
  <title>Three lifecycles. A spec goes draft, approved (you approve), building, done, and any amendment sends it back to draft; any state can become superseded. A run goes plan, build, pr, land, deploy, staging, done; when a rule needs you it escalates and resumes after your decision. A version goes dev pinned, dev healthy, dev smoke passed, staging, staging smoke passed, prod, where you promote and the digest must match staging.</title>
  <style>svg{--bg:#ffffff;--surface:#ffffff;--fg:#1d2330;--muted:#5b6475;--line:#d5d9e2;--accent:#3d4fc4;--accent-soft:#eceefc;--ok:#2f7d4f;--warn:#a3580b;--warn-soft:#fbefe1;--sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--fg)}@media (prefers-color-scheme: dark){svg{--bg:#1a1e28;--surface:#1a1e28;--fg:#e4e7ee;--muted:#9aa2b3;--line:#2f3545;--accent:#9aa6ff;--accent-soft:#232945;--ok:#6fcf97;--warn:#e8a85c;--warn-soft:#3a2a17;}}text{font-family:var(--sans)}.bg{fill:var(--bg)}.band { fill: none; stroke: var(--line); stroke-width: 1.4; }.band.acc { fill: var(--accent-soft); stroke: var(--accent); stroke-dasharray: 6 4; }.node.ext { fill: var(--surface); stroke: var(--accent); stroke-width: 1.6; }.node.core { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }.node.gate { stroke-width: 3; }.pill { font-size: 13px; fill: currentColor; }.rowname { font-size: 14px; font-weight: 600; fill: currentColor; }.node { fill: var(--surface); stroke: currentColor; stroke-width: 1.4; }.node.env { fill: var(--accent-soft); stroke: var(--accent); }.node.inst { fill: var(--surface); stroke: var(--accent); stroke-width: 1.4; }.node.empty { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }.chip { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }.edge { fill: none; stroke: currentColor; stroke-width: 1.4; }.edge.acc { stroke: var(--accent); }.edge.m { stroke: var(--muted); stroke-dasharray: 4 4; }.kind { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.08em; fill: var(--muted); }.kind.acc { fill: var(--accent); }.name { font-size: 15px; font-weight: 600; fill: currentColor; }.big { font-size: 18px; font-weight: 600; fill: currentColor; }.sha { font-family: var(--mono); font-size: 14px; font-weight: 500; fill: currentColor; }.src { font-family: var(--mono); font-size: 11px; fill: var(--muted); }.okt { font-family: var(--mono); font-size: 11px; fill: var(--ok); }.lbl { font-size: 12px; fill: currentColor; }.lbl.m { fill: var(--muted); }.lbl.acc { fill: var(--accent); font-weight: 500; }.arrow { fill: currentColor; }.arrow.acc { fill: var(--accent); }.arrow.m { fill: var(--muted); }</style>
  <rect class="bg" x="0" y="0" width="1000" height="380"/>
      <defs>
        <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow"/></marker>
        <marker id="lm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow m"/></marker>
      </defs>

      <!-- Spec -->
      <text x="24" y="70" class="rowname">Spec</text>
      <text x="24" y="86" class="src">ADR-026</text>
      <rect x="180" y="50" width="120" height="40" rx="20" class="node"/><text x="240" y="75" text-anchor="middle" class="pill">draft</text>
      <rect x="340" y="50" width="120" height="40" rx="20" class="node gate"/><text x="400" y="75" text-anchor="middle" class="pill">approved</text>
      <rect x="500" y="50" width="120" height="40" rx="20" class="node"/><text x="560" y="75" text-anchor="middle" class="pill">building</text>
      <rect x="660" y="50" width="120" height="40" rx="20" class="node"/><text x="720" y="75" text-anchor="middle" class="pill">done</text>
      <rect x="840" y="50" width="130" height="40" rx="20" class="node empty"/><text x="905" y="75" text-anchor="middle" class="pill">superseded</text>
      <line x1="300" y1="70" x2="338" y2="70" class="edge" marker-end="url(#l)"/>
      <text x="320" y="42" text-anchor="middle" class="lbl"><tspan font-weight="600">you approve</tspan></text>
      <line x1="460" y1="70" x2="498" y2="70" class="edge" marker-end="url(#l)"/>
      <line x1="620" y1="70" x2="658" y2="70" class="edge" marker-end="url(#l)"/>
      <text x="640" y="42" text-anchor="middle" class="lbl">verified pass</text>
      <line x1="780" y1="70" x2="838" y2="70" class="edge m" marker-end="url(#lm)"/>
      <text x="810" y="42" text-anchor="middle" class="lbl m">any</text>
      <path d="M720,90 V110 H240 V92" class="edge m" marker-end="url(#lm)"/>
      <text x="480" y="126" text-anchor="middle" class="lbl m">an amendment sends it back to draft</text>

      <!-- Run -->
      <text x="24" y="180" class="rowname">Run</text>
      <text x="24" y="196" class="src">/component:ship</text>
      <rect x="180" y="160" width="96" height="40" rx="20" class="node"/><text x="228" y="185" text-anchor="middle" class="pill">plan</text>
      <rect x="290" y="160" width="96" height="40" rx="20" class="node"/><text x="338" y="185" text-anchor="middle" class="pill">build</text>
      <rect x="400" y="160" width="96" height="40" rx="20" class="node"/><text x="448" y="185" text-anchor="middle" class="pill">pr</text>
      <rect x="510" y="160" width="96" height="40" rx="20" class="node"/><text x="558" y="185" text-anchor="middle" class="pill">land</text>
      <rect x="620" y="160" width="96" height="40" rx="20" class="node"/><text x="668" y="185" text-anchor="middle" class="pill">deploy</text>
      <rect x="730" y="160" width="96" height="40" rx="20" class="node"/><text x="778" y="185" text-anchor="middle" class="pill">staging</text>
      <rect x="840" y="160" width="96" height="40" rx="20" class="node"/><text x="888" y="185" text-anchor="middle" class="pill">done</text>
      <line x1="276" y1="180" x2="288" y2="180" class="edge" marker-end="url(#l)"/>
      <line x1="386" y1="180" x2="398" y2="180" class="edge" marker-end="url(#l)"/>
      <line x1="496" y1="180" x2="508" y2="180" class="edge" marker-end="url(#l)"/>
      <line x1="606" y1="180" x2="618" y2="180" class="edge" marker-end="url(#l)"/>
      <line x1="716" y1="180" x2="728" y2="180" class="edge" marker-end="url(#l)"/>
      <line x1="826" y1="180" x2="838" y2="180" class="edge" marker-end="url(#l)"/>
      <text x="338" y="152" text-anchor="middle" class="lbl m">red tests → green</text>
      <text x="558" y="152" text-anchor="middle" class="lbl m">≤ 3 CI fix rounds</text>
      <text x="723" y="152" text-anchor="middle" class="lbl m">dev smoke</text>
      <rect x="500" y="240" width="160" height="40" rx="20" class="node gate"/><text x="580" y="265" text-anchor="middle" class="pill">escalated</text>
      <line x1="545" y1="200" x2="545" y2="238" class="edge" marker-end="url(#l)"/>
      <text x="537" y="226" text-anchor="end" class="lbl">a rule needs you, budget used up</text>
      <line x1="615" y1="240" x2="615" y2="202" class="edge" marker-end="url(#l)"/>
      <text x="623" y="226" class="lbl"><tspan font-weight="600">you decide</tspan>, then resume</text>

      <!-- Version -->
      <text x="24" y="320" class="rowname">Version</text>
      <text x="24" y="336" class="src">per environment</text>
      <rect x="180" y="300" width="120" height="40" rx="20" class="node"/><text x="240" y="325" text-anchor="middle" class="pill">dev pinned</text>
      <rect x="318" y="300" width="120" height="40" rx="20" class="node"/><text x="378" y="325" text-anchor="middle" class="pill">dev healthy</text>
      <rect x="456" y="300" width="120" height="40" rx="20" class="node"/><text x="516" y="325" text-anchor="middle" class="pill">dev verified</text>
      <rect x="594" y="300" width="120" height="40" rx="20" class="node"/><text x="654" y="325" text-anchor="middle" class="pill">staging</text>
      <rect x="732" y="300" width="120" height="40" rx="20" class="node"/><text x="792" y="325" text-anchor="middle" class="pill">staging verified</text>
      <rect x="870" y="300" width="110" height="40" rx="20" class="node gate"/><text x="925" y="325" text-anchor="middle" class="pill">prod</text>
      <line x1="300" y1="320" x2="316" y2="320" class="edge" marker-end="url(#l)"/>
      <line x1="438" y1="320" x2="454" y2="320" class="edge" marker-end="url(#l)"/>
      <line x1="576" y1="320" x2="592" y2="320" class="edge" marker-end="url(#l)"/>
      <line x1="714" y1="320" x2="730" y2="320" class="edge" marker-end="url(#l)"/>
      <line x1="852" y1="320" x2="868" y2="320" class="edge" marker-end="url(#l)"/>
      <text x="309" y="292" text-anchor="middle" class="lbl m">Argo</text>
      <text x="447" y="292" text-anchor="middle" class="lbl m">smoke</text>
      <text x="585" y="292" text-anchor="middle" class="lbl m">auto</text>
      <text x="861" y="292" text-anchor="middle" class="lbl"><tspan font-weight="600">you promote</tspan></text>
      <text x="580" y="366" text-anchor="middle" class="lbl m">a smoke that did not run is NOT VERIFIED and promotes nothing · prod must run the digest staging verified</text>
    </svg>
