openapi: 3.1.0
info:
  title: Autonomy engine — signals and status (spec 124)
  version: "1"
  description: |
    The HTTP surface an autonomy engine (ai-ops in 5.x) offers to `cplat system autonomy` (design.md "Engine HTTP").
    The base URL is `environments.<env>.autonomy.engine` in system.yaml. The policy itself is never sent over HTTP:
    the engine reads `applications/<system>/autonomy.json` at `main`. A signal never raises autonomy above that policy.
servers:
  - url: "{engine}"
    variables:
      engine: {default: "https://ai-ops.example.com"}
security:
  - bearer: []
paths:
  /v1/signals:
    post:
      summary: Pause, resume or lower one environment at once (AC-124.6, AC-124.7)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Signal"}
            example:
              id: sig-3f9c2a71b0de
              kind: pause
              system: shop
              environment: prod
              at: "2026-10-26T09:20:00Z"
              actor: eike
              policy: null
              pr: null
      responses:
        "200":
          description: The environment acts as requested (idempotent per id)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Confirmation"}
              example: {id: sig-3f9c2a71b0de, environment: prod, confirmed: true, effective: observe, at: "2026-10-26T09:20:01Z"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409":
          description: A lower signal would loosen a field; nothing changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    required: [fields]
                    properties:
                      fields: {type: array, items: {type: string}, example: ["riskGate.maxLines"]}
  /v1/status:
    get:
      summary: Heartbeat and the state per environment (AC-124.8, AC-124.13, AC-124.21)
      parameters:
        - {name: system, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: The engine's state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "401": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Level: {type: string, enum: [observe, advise, propose, act, improve]}
    Error:
      type: object
      required: [error, detail]
      properties:
        error: {type: string}
        detail: {type: [string, "null"]}
    Signal:
      type: object
      required: [id, kind, system, environment, at, actor, policy, pr]
      properties:
        id: {type: string, pattern: "^sig-[0-9a-f]{12}$"}
        kind: {type: string, enum: [pause, resume, lower]}
        system: {type: string}
        environment: {type: string, enum: [dev, staging, prod]}
        at: {type: string, format: date-time}
        actor: {type: string, description: GitHub login of the person}
        policy:
          description: For `lower` only; the environment autonomy object of design.md with the tighter value of each field
          oneOf: [{$ref: "#/components/schemas/EnvironmentPolicy"}, {type: "null"}]
        pr: {type: [string, "null"], description: URL of the pull request that records the change}
    Confirmation:
      type: object
      required: [id, environment, confirmed, effective, at]
      properties:
        id: {type: string}
        environment: {type: string}
        confirmed: {type: boolean}
        effective: {$ref: "#/components/schemas/Level"}
        at: {type: string, format: date-time}
    Status:
      type: object
      required: [engine, heartbeat_at, environments]
      properties:
        engine:
          type: object
          required: [name, version]
          properties:
            name: {type: string, example: ai-ops}
            version: {type: string}
        heartbeat_at: {type: string, format: date-time, description: older than 5 minutes = unreachable}
        environments:
          type: object
          additionalProperties:
            type: object
            required: [policy_commit, applied_at, declared, effective, paused, signals]
            properties:
              policy_commit: {type: string, description: commit of autonomy.json in effect}
              applied_at: {type: string, format: date-time}
              declared: {$ref: "#/components/schemas/Level"}
              effective: {$ref: "#/components/schemas/Level"}
              paused: {type: boolean}
              signals:
                type: array
                items:
                  type: object
                  required: [id, kind, at]
                  properties:
                    id: {type: string}
                    kind: {type: string, enum: [pause, resume, lower]}
                    at: {type: string, format: date-time}
    EnvironmentPolicy:
      type: object
      description: environments[].autonomy of `cplat model show --json` (design.md)
      required: [declared, effective, cap, paused, engine, autoMerge, riskGate, budget, window, undoWindow, promotion]
      properties:
        declared: {$ref: "#/components/schemas/Level"}
        effective: {$ref: "#/components/schemas/Level"}
        cap: {$ref: "#/components/schemas/Level"}
        paused: {type: boolean}
        engine: {type: [string, "null"]}
        autoMerge:
          type: object
          required: [routes, maxCriticality]
          properties:
            routes: {type: array, items: {type: string, enum: [fix]}}
            maxCriticality: {type: string, enum: [low, medium, high]}
        riskGate:
          type: object
          required: [maxFiles, maxLines, regressionTest, secondReview]
          properties:
            maxFiles: {type: integer, minimum: 1}
            maxLines: {type: integer, minimum: 1}
            regressionTest: {type: boolean}
            secondReview: {type: boolean}
        budget:
          type: object
          required: [runsPerDay, mergesPerDay, perRun]
          properties:
            runsPerDay: {type: integer, minimum: 0}
            mergesPerDay: {type: integer, minimum: 0}
            perRun:
              type: object
              required: [minutes, invocations, reruns, cost]
              properties:
                minutes: {type: number, exclusiveMinimum: 0}
                invocations: {type: number, exclusiveMinimum: 0}
                reruns: {type: number, exclusiveMinimum: 0}
                cost: {type: number, exclusiveMinimum: 0}
        window:
          type: object
          required: [days, from, to, timezone]
          properties:
            days: {type: array, items: {type: string, enum: [mon, tue, wed, thu, fri, sat, sun]}}
            from: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
            to: {type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"}
            timezone: {type: string}
        undoWindow: {type: string, pattern: "^[1-9][0-9]{0,3}[mhd]$"}
        promotion: {type: string, enum: [main, after-dev-smoke, manual]}
