rules:
  - id: R2
    text: "never modify code you haven't read, so that your change fits what is there"
    class: practice
  - id: R3
    text: "do not reinvent them, so that the style matches CI"
    class: practice
  - id: R4
    text: "never log secrets or full request bodies, because logs are widely copied"
    class: practice
  - id: R5
    text: "do not refactor, rename or \"improve\" surrounding code, so that the diff stays reviewable"
    class: practice
  - id: R6
    text: "never hardcode secrets, because git history keeps committed secrets"
    class: hard
    hard: no-secrets-in-git
  - id: R7
    text: "never hardcode it, so that the binary reports its git tag"
    class: practice
  - id: R8
    text: "Never edit, skip or weaken them, because a changed test no longer defines done"
    class: hard
    hard: acceptance-tests-fixed
    source: spec 160
  - id: R9
    text: "Write files with Write and Edit, never through the shell (`cat >`, heredocs, `tee`, `echo >`), because headless runs refuse those commands."
    class: practice
  - id: R10
    text: "run every tool through `devbox run <script>`, never `go`, `gofmt`, `goimports`, `golangci-lint` or `govulncheck` directly, so that versions and flags match CI"
    class: practice
  - id: R11
    text: "read the summary first, the log if it is not enough, and never rerun for full output, because the log holds it"
    class: practice
  - id: R12
    text: "Hand the full test suite to the tester agent, so that someone other than the author verifies the code"
    class: practice
  - id: R13
    text: "Read `cplat`'s output whole, never through `grep`, `head` or `tail`, because its last lines carry the decisions and fixes; use `--json` where offered."
    class: practice
    source: "#476"
  - id: R14
    text: "never file an issue without the user's OK, because the platform repository is public; a `platform` escalation is the one issue the platform files itself (ADR-033)."
    class: hard
    hard: issue-filing-needs-consent
    source: ADR-033
