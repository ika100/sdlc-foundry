rules:
  - id: R1
    text: "never ask the user to paste a secret into this chat and never pass it as an argument, because both leave the value in logs"
    class: practice
  - id: R2
    text: "never file an issue without the user's OK, because the platform repository is public; the platform posts only `platform` escalations and milestone comments itself"
    class: hard
    hard: issue-filing-needs-consent
    source: "ADR-033, ADR-122"
  - id: R3
    text: "Read `cplat`'s output whole, never through `grep`, `head` or `tail`, because its last lines carry the decisions and fixes"
    class: practice
    source: "#476"
