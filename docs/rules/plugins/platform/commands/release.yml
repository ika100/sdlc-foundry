rules:
  - id: R1
    text: "read its output whole (never piped into `grep`, `head` or `tail`, because its last lines carry the decisions and next steps; use `--json` where offered)"
    class: practice
    source: "#476"
  - id: R2
    text: "Never merge, tag, push or create a release by hand, because the command checks each step first."
    class: practice
  - id: R3
    text: "Never pass `--confirm` without the user's yes, because a merge or a tag cannot be undone."
    class: practice
  - id: R4
    text: "never file an issue without the user's OK, because the platform repository is public; a `platform` escalation is the one issue the platform files itself (ADR-033)."
    class: hard
    hard: issue-filing-needs-consent
