rules:
  - id: R1
    text: "its output read whole (never piped into `grep`, `head` or `tail`, because its last lines carry the decisions and next steps; use `--json` where offered)"
    class: practice
    source: "#476"
  - id: R2
    text: "Always preview a migration with `--dry-run --migrate`, because it prints the `system.yaml` it would write."
    class: practice
  - id: R3
    text: "Never push or open a PR, because the update ends on a review branch the user reviews first."
    class: practice
  - id: R4
    text: "Never edit the update's result by hand, because the template is the source of truth."
    class: practice
  - id: R5
    text: "never file an issue without the user's OK, because the platform repository is public; a `platform` escalation is the one issue the platform files itself (ADR-033)."
    class: hard
    hard: issue-filing-needs-consent
