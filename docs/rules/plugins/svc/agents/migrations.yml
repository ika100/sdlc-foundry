rules:
  - id: R1
    text: "run every tool through `devbox run <script>`, never `alembic` directly, so that versions and flags match CI"
    class: practice
  - id: R2
    text: "**Always read the generated file** in `migrations/versions/` and verify, because autogenerate is frequently wrong for column renames, type changes and constraint edits:"
    class: practice
  - id: R3
    text: "Seeds must be idempotent, because a migration run twice must not duplicate rows"
    class: practice
  - id: R4
    text: "**Do not modify application model files** (`models.py`, `schema.py`), only migration scripts, because application code belongs to the coder agent"
    class: practice
  - id: R5
    text: "**Always flag destructive operations** (`DROP TABLE`, `DROP COLUMN`, `ALTER COLUMN ... NOT NULL` on data-bearing tables) before proceeding, since they cannot be undone once applied"
    class: practice
  - id: R6
    text: "**Migration scripts must be committed** before running in any shared environment, so that every environment applies the same reviewed history"
    class: practice
  - id: R7
    text: "never file an issue without the user's OK, because the platform repository is public"
    class: hard
    hard: issue-filing-needs-consent
    source: ADR-033
  - id: R8
    text: "You do not modify application models or business logic."
    class: retired
    retired: 2026-11-10
    reason: it repeats the rule against editing application model files in the Rules section
    benchmark_runs: [20261110T000411Z-cc03e09e, 20261110T000533Z-a616f78e]
  - id: R9
    text: "**Always verify autogenerated downgrades.** They're frequently wrong for column renames, type changes, and constraint edits."
    class: retired
    retired: 2026-11-10
    reason: it repeats the rule to read and verify every generated migration in step 3
    benchmark_runs: [20261110T000411Z-cc03e09e, 20261110T000533Z-a616f78e]
