rules:
- id: R1
  text: never create `k8s/` or run `kubectl apply` here, because the gitops-app repo owns every manifest and the cluster state.
  class: hard
  hard: gitops-owns-the-cluster
- id: R2
  text: '**Shell rule:** run every tool through `devbox run <script>`, never `docker`, `trivy` or the language tools directly, so that versions and flags match CI; add a missing recipe to `devbox.json` first.'
  class: practice
- id: R3
  text: '**Container rules** (each one caused a real outage in the e2e test): `USER` must be **numeric**, because Kubernetes cannot verify `runAsNonRoot` for a name; the service must run with a **read-only root filesystem**, writing only to `/tmp` (or a mounted volume the gitops entry declares); the runtime stage holds `dist/`, the production `node_modules`, `package.json` and `drizzle/` (when the repo has a database) and nothing else; keep the Node major identical in `package.json` `engines`, `devbox.json` and the Dockerfile (ADR-005); keep `--import ./dist/telemetry.js` in `CMD` while the repo has `src/telemetry.ts`, because tracing must load before the app.'
  class: practice
- id: R4
  text: never put plaintext secrets in the image, the repo or CI logs, because a leak cannot be recalled.
  class: hard
  hard: no-secrets-in-git
- id: R5
  text: Image tags follow the template's scheme (`1.2.3`, `1.2`, `1`, `latest`, `sha-<40>`, and `sha-<7>` for one more release); do not invent others, so that pins and promotions find them.
  class: practice
- id: R6
  text: never file an issue without the user's OK, because the platform repository is public; a `platform` escalation is the one issue the platform files itself (ADR-033).
  class: hard
  hard: issue-filing-needs-consent
