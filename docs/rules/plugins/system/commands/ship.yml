rules:
  - id: R1
    text: "output read whole (never piped into `grep`, `head` or `tail`, because its last lines carry the decisions and fixes; use `--json` where offered)"
    class: practice
    source: "#476"
  - id: R2
    text: "two stops without a new commit or phase change escalate the run, so that you commit each finished task."
    class: practice
  - id: R3
    text: "Stop earlier only after `cplat system ship escalate` or when the run is done, because the hook counts any other stop against the run."
    class: practice
  - id: R4
    text: "Ask the user only `do: ask`, because the spec's approval was the decision."
    class: practice
  - id: R5
    text: "Never merge by hand or promote beyond dev, because `cplat` merges on green checks."
    class: practice
  - id: R6
    text: "push only through `cplat`, never to a default branch or forced, because a shell push reaches GitHub before any check runs."
    class: hard
    hard: push-only-through-pr-open
  - id: R7
    text: "Never answer a repo spec's questions, because `repo start` writes the spec from the plan and none arise."
    class: practice
    source: spec 141
  - id: R8
    text: "Never wait with a shell loop on a file, git HEAD or an image, because `cplat system ship next --wait` blocks until a repo finishes."
    class: experience
    source: "#496"
  - id: R12
    text: "never file an issue without the user's OK, because the platform repository is public; the platform posts only `platform` escalations and milestone comments itself (ADR-033, ADR-122)."
    class: hard
    hard: issue-filing-needs-consent
  - id: R15
    text: "An escalation decision that needs work always becomes a plan task before the ship goes on, so that it is done."
    class: practice
    source: spec 185
  - id: R17
    text: "wait again; escalate only after three `TIMEOUT:` in a row (a `WAIT:` resets the count): `cplat system ship escalate '<the TIMEOUT line>' --cause environment`, because a stuck driver means runner or cluster."
    class: practice
    source: spec 216
  - id: R18
    text: "Never run the verbs of the driver (`cplat system ship next --json`, `repo start`, `repo resume`, `repo hold`, `land`, `phase complete`, `complete`, `finish`), because it applies those rules and a second actor would race it on the state."
    class: practice
    source: spec 216
  - id: R19
    text: "`driver: off`, or to answer the questions of an `ESCALATED:` (`cplat system ship start <spec>`, then `CPLAT_SYSTEM_DRIVER=0 cplat system ship drive`): read `${CLAUDE_PLUGIN_ROOT}/references/ship-loop.md` and follow it, because the driver never asks."
    class: practice
    source: spec 216
  - id: R13
    text: "The shape must be `gitops-app`."
    class: retired
    retired: 2026-11-10
    reason: system ship start refuses a repo whose shape is not gitops-app
    enforced_by: cplat system ship
    benchmark_runs: [20261110T000411Z-cc03e09e, 20261110T000533Z-a616f78e]
