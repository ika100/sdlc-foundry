rules:
  - id: R1
    text: "do not retry with guesses, because a guess can create the wrong repo"
    class: practice
  - id: R2
    text: "never file an issue without the user's OK, because the platform repository is public; a `platform` escalation is the one issue the platform files itself (ADR-033)"
    class: hard
    hard: issue-filing-needs-consent
  - id: R3
    text: "Read `cplat`'s output whole, never through `grep`, `head` or `tail`, because its last lines carry the decisions and fixes"
    class: practice
    source: "#476"
  - id: R4
    text: "never create a public repo unless the user asked"
    class: retired
    retired: 2026-11-10
    reason: the script creates a private repo and repeats the sentence on the repo being private
    enforced_by: cplat cluster new
    benchmark_runs: [20261110T000411Z-cc03e09e, 20261110T000533Z-a616f78e]
  - id: R5
    text: "never overwrite a non-empty directory"
    class: retired
    retired: 2026-11-10
    reason: the script refuses a non-empty directory itself
    enforced_by: cplat cluster new
    benchmark_runs: [20261110T000411Z-cc03e09e, 20261110T000533Z-a616f78e]
