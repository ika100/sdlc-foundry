rules:
  - id: R1
    text: "never create `k8s/` or run `kubectl apply` here, because the gitops-app repo owns every manifest and the cluster state"
    class: hard
    hard: gitops-owns-the-cluster
  - id: R2
    text: "run every tool through `devbox run <script>`, never `docker`, `trivy` or the language tools directly, so that versions and flags match CI"
    class: practice
  - id: R3
    text: "`USER` must be **numeric**, because Kubernetes cannot verify `runAsNonRoot` for a name"
    class: practice
  - id: R4
    text: "never put plaintext secrets in the image, the repo or CI logs, because a leak cannot be recalled"
    class: hard
    hard: no-secrets-in-git
  - id: R5
    text: "do not invent others, so that pins and promotions find them"
    class: practice
  - id: R6
    text: "never file an issue without the user's OK, because the platform repository is public; a `platform` escalation is the one issue the platform files itself (ADR-033)"
    class: hard
    hard: issue-filing-needs-consent
  - id: R7
    text: "Never `kubectl apply`."
    class: retired
    retired: 2026-11-10
    reason: the rule against k8s manifests and kubectl in the opening paragraph covers it
    benchmark_runs: [20261110T000411Z-cc03e09e, 20261110T000533Z-a616f78e]
