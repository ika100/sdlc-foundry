# shapes.yml — canonical shape registry for sdlc-foundry (ADR-015).
#
# Adding a shape: add an entry here, a template under templates/<template>/, a plugin
# under plugins/<plugin>/, and a matching sniff rule in scripts/detect-shape.sh.
# `scripts/shapes.py check` (run in CI) keeps this file, the templates, and the PRD §4 table consistent.
shapes:
  - id: service-python
    plugin: svc
    template: service-python
    deployable: true
    test_globs: ["tests/**/*.py"]   # where `cplat spec trace` looks for AC ids (ADR-026)
    smoke_tag: 'pytest\.mark\.smoke\b'   # regex: a test file naming a (smoke) criterion must match it (spec 091)
    ci_checks: ["quality (ruff + mypy)", "test (pytest + coverage)", "security (pip-audit + detect-secrets + bandit)", "ci-extra"]   # required on main by new-service (spec 054)
    validation:   # spec 103: what `cplat validate` selects and which changes always run the full tests and security
      selector: pytest
      mandatory:
        api-contract: ["**/openapi*", "**/api/**", "**/routes*", "**/schemas*"]
        migrations: ["migrations/**", "**/migrations/**"]
    library: false
    detection:
      copier_src: templates/service-python
      sniff:
        - "pyproject.toml + Dockerfile"
    default_stack:
      language: python
      version: "3.12"
      framework: fastapi
    runtime:
      port: 8080
      probes: {liveness: /health, readiness: /ready}
      metrics: /metrics   # Prometheus endpoint scraped by the observability addon's collector
      user: 10001
      volumes: {tmp: /tmp}
      env: {LOG_LEVEL: INFO}
      resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
    status: stable
    adr: null

  - id: library-python
    plugin: svc
    template: library-python
    deployable: false
    test_globs: ["tests/**/*.py"]   # where `cplat spec trace` looks for AC ids (ADR-026)
    ci_checks: ["quality (ruff + mypy)", "test (pytest + coverage)", "security (pip-audit + detect-secrets + bandit)", "ci-extra"]   # required on main by new-service (spec 054)
    validation:   # spec 103: what `cplat validate` selects and which changes always run the full tests and security
      selector: pytest
    library: true
    detection:
      copier_src: templates/library-python
      sniff:
        - "pyproject.toml without Dockerfile"
    default_stack:
      language: python
      version: "3.12"
    status: stable
    adr: null

  - id: web-nextjs
    plugin: web
    template: web-nextjs
    deployable: true
    test_globs: ["tests/**/*.ts", "tests/**/*.tsx", "e2e/**/*.ts"]   # where `cplat spec trace` looks for AC ids (ADR-026)
    smoke_tag: '@smoke\b'   # regex: a test file naming a (smoke) criterion must match it (spec 091)
    smoke_globs: ["e2e/**/*.ts"]   # where trace looks for smoke tests (default: test_globs)
    ci_checks: ["quality (eslint + tsc)", "test (vitest + coverage)", "security (pnpm audit + detect-secrets)", "ci-extra"]   # required on main by new-service (spec 054)
    validation:   # spec 103: what `cplat validate` selects and which changes always run the full tests and security
      selector: vitest
      mandatory:
        routes-config: ["app/**/page.*", "app/**/route.*", "pages/**", "next.config.*", "tsconfig*.json", "vite*.config.*"]
    library: false
    detection:
      copier_src: templates/web-nextjs
      sniff:
        - "next.config.*"
        - "package.json contains \"next\""
    default_stack:
      language: typescript
      runtime: node-lts
      framework: nextjs-app-router
    runtime:
      port: 3000
      probes: {liveness: /api/health, readiness: /api/ready}
      metrics: /api/metrics   # Prometheus endpoint scraped by the observability addon's collector
      user: 1000
      volumes: {tmp: /tmp, next-cache: /app/.next/cache}
      env: {NODE_ENV: production}
      resources: {requests: {cpu: 100m, memory: 192Mi}, limits: {cpu: 1000m, memory: 512Mi}}
    status: stable
    adr: [2, 3, 4, 5]

  - id: gitops-app
    plugin: gitops
    template: gitops-app
    deployable: false
    test_globs: ["tests/**/*"]   # where `cplat spec trace` looks for AC ids (ADR-026)
    ci_checks: ["quality (render-check + kustomize build + kubeconform + labels)", "security (detect-secrets)", "ci-extra"]   # required on main by new-service (spec 054)
    validation:   # spec 103: what `cplat validate` selects and which changes always run the full tests and security
      selector: null
      mandatory:
        environments: ["environments/**", "apps/**", "base/**"]
    library: false
    detection:
      copier_src: templates/gitops-app
      sniff:
        - "applications/*/applicationset.yaml"
    default_stack:
      kind: kustomize+argocd
    status: stable
    adr: [6, 14]

  - id: service-java
    plugin: svc-java
    template: service-java
    deployable: true
    test_globs: ["src/test/**/*.java"]   # where `cplat spec trace` looks for AC ids (ADR-026)
    smoke_tag: '@Tag\(\s*"smoke"\s*\)'   # regex: a test file naming a (smoke) criterion must match it (spec 091)
    ci_checks: ["quality (spotless + checkstyle + compile)", "test (mvn verify + JaCoCo)", "security (OWASP dependency-check + detect-secrets)", "ci-extra"]   # required on main by new-service (spec 054)
    validation:   # spec 103: what `cplat validate` selects and which changes always run the full tests and security
      selector: null
      mandatory:
        api-contract: ["**/openapi*", "**/api/**", "**/routes*", "**/schemas*"]
        migrations: ["migrations/**", "**/migrations/**"]
    library: false
    detection:
      copier_src: templates/service-java
      sniff:
        - "pom.xml"
        - "build.gradle*"
    default_stack:
      language: java
      version: "21"
      build_tool: maven
      framework: spring-boot-3
    runtime:
      port: 8080
      probes: {liveness: /actuator/health/liveness, readiness: /actuator/health/readiness}
      metrics: /actuator/prometheus   # Prometheus endpoint scraped by the observability addon's collector
      user: 65532
      volumes: {tmp: /tmp}
      env: {LOG_LEVEL: INFO, JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -Djava.io.tmpdir=/tmp"}
      resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {cpu: 1000m, memory: 768Mi}}
    status: stable
    adr: [9]

  - id: service-go
    plugin: svc-go
    template: service-go
    deployable: true
    test_globs: ["**/*_test.go"]   # where `cplat spec trace` looks for AC ids (ADR-026)
    smoke_tag: 'func\s+TestSmoke\w*\s*\('   # regex: a test file naming a (smoke) criterion must match it (spec 091)
    ci_checks: ["quality (golangci-lint + go build)", "test (go test -race -cover)", "security (govulncheck + detect-secrets)", "ci-extra"]   # required on main by new-service (spec 054)
    validation:   # spec 103: what `cplat validate` selects and which changes always run the full tests and security
      selector: null
      mandatory:
        api-contract: ["**/openapi*", "**/api/**", "**/routes*", "**/schemas*"]
        migrations: ["migrations/**", "**/migrations/**"]
    library: false
    detection:
      copier_src: templates/service-go
      sniff:
        - "go.mod"
    default_stack:
      language: go
      version: "1.22"
      router: chi
    runtime:
      port: 8080
      probes: {liveness: /health, readiness: /ready}
      metrics: /metrics   # Prometheus endpoint scraped by the observability addon's collector
      user: 65532
      volumes: {}
      env: {LOG_LEVEL: INFO}
      resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
    status: stable
    adr: [10]
