name: ci

on:
  push:
    # other branches get CI from their PR only: a push trigger on them too ran every job twice (sdlc-foundry #104)
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]   # edited: a corrected PR title is checked again
  workflow_dispatch:

# Least privilege by default; jobs that publish packages declare what they need.
permissions:
  contents: read

# A newer push to the same pull request cancels the older run (main and tags always run to completion).
concurrency:
  group: ci-${{ '{{' }} github.event.pull_request.number || github.ref {{ '}}' }}${{ '{{' }} github.event.action == 'edited' && '-edited' || '' {{ '}}' }}   # a title edit never cancels a running build
  cancel-in-progress: ${{ '{{' }} github.event_name == 'pull_request' {{ '}}' }}

jobs:
  quality:
    name: quality (ruff + mypy)
    runs-on: ${{ '{{' }} vars.CI_RUNNER || 'ubuntu-latest' {{ '}}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        if: runner.environment == 'github-hosted'   # self-hosted runner images ship devbox (docs/self-hosted-runners.md)
        with:
          enable-cache: true
      - run: devbox run quality

  test:
    name: test (pytest + coverage)
    runs-on: ${{ '{{' }} vars.CI_RUNNER || 'ubuntu-latest' {{ '}}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        if: runner.environment == 'github-hosted'   # self-hosted runner images ship devbox (docs/self-hosted-runners.md)
        with:
          enable-cache: true
      - run: devbox run test

  security:
    name: security (pip-audit + detect-secrets + bandit)
    runs-on: ${{ '{{' }} vars.CI_RUNNER || 'ubuntu-latest' {{ '}}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        if: runner.environment == 'github-hosted'   # self-hosted runner images ship devbox (docs/self-hosted-runners.md)
        with:
          enable-cache: true
      - run: devbox run security

  ci-extra:
    name: ci-extra
    runs-on: ${{ '{{' }} vars.CI_RUNNER || 'ubuntu-latest' {{ '}}' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Is a ci-extra recipe defined?
        id: recipe
        run: |
          if grep -qs '"ci-extra"[[:space:]]*:' devbox.json; then
            echo "defined=true" >> "$GITHUB_OUTPUT"
          else
            echo "defined=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no ci-extra recipe is defined in devbox.json: nothing to run (spec 086)"
          fi
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        if: runner.environment == 'github-hosted' && steps.recipe.outputs.defined == 'true'   # self-hosted runner images ship devbox (docs/self-hosted-runners.md)
        with:
          enable-cache: true
      - run: devbox run ci-extra
        if: steps.recipe.outputs.defined == 'true'

  publish:
    name: publish (attach the package to the GitHub release)
    # Spec 213 / ADR-125: only a v* tag publishes, after every gate of the same run passed; the version check in
    # scripts/publish.sh fails before any upload when the built version is not the tag's.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, test, security, ci-extra]
    runs-on: ${{ '{{' }} vars.CI_RUNNER || 'ubuntu-latest' {{ '}}' }}
    permissions:
      contents: write   # create the release and upload its assets; the only write permission in this workflow
      id-token: write      # the OIDC token the build provenance is signed with (#966)
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the version is read from the tag (hatch-vcs, spec 138)
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        if: runner.environment == 'github-hosted'   # self-hosted runner images ship devbox (docs/self-hosted-runners.md)
        with:
          enable-cache: true
      - name: Build, check the version and upload
        env:
          GH_TOKEN: ${{ '{{' }} secrets.GITHUB_TOKEN {{ '}}' }}
        run: devbox run publish "$GITHUB_REF_NAME"
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  pr-title:
    name: pr-title (conventional commits)
    runs-on: ${{ '{{' }} vars.CI_RUNNER || 'ubuntu-latest' {{ '}}' }}
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title
        env:
          PR_TITLE: ${{ '{{' }} github.event.pull_request.title {{ '}}' }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|revert)(\(.+\))?!?: .{1,72}$'
          if ! echo "$PR_TITLE" | grep -qE "$pattern"; then
            echo "ERROR: PR title does not follow Conventional Commits."
            echo "  Got:     $PR_TITLE"
            exit 1
          fi
          echo "OK: PR title is valid."
