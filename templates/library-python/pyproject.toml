[project]
name = "{{ project_name }}"
dynamic = ["version"]   # read from the git tag at build time (hatch-vcs, spec 138)
description = "{{ description }}"
readme = "README.md"
requires-python = ">={{ python_version }}"
license = { text = "Apache-2.0" }
authors = [{ name = "{{ owner_team }}" }]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "bandit>=1.7",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# A release tag vX.Y.Z is the library's version: installed from the tag it reads X.Y.Z, a build of main a development
# version after the last tag, a checkout without git history 0.0.0.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.uv]
# rebuild the project when a commit or tag changes its version
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/{{ module_name }}"]

[tool.ruff]
line-length = 100
# docs/ holds specs and designs (ADR-026); their code examples are not lint targets (spec 049)
extend-exclude = ["docs"]
target-version = "py{{ python_version | replace('.', '') }}"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PTH"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "{{ python_version }}"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
