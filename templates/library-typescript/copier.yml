# Copier template: library-typescript
# TypeScript library published as an npm package `@<owner>/<repo>` to GitHub Packages on the release tag (spec 215,
# ADR-125): ESM only, compiled with tsc, Vitest, ESLint + tsc, pnpm (ADR-003), pinned Node LTS (ADR-005). The tooling is
# the service-typescript template's (ADR-124); no HTTP server, no Dockerfile, no GitOps deployment.
#
# Usage:
#   copier copy <platform-checkout>/templates/library-typescript ./<project> --data project_name=<name>

_min_copier_version: "9.0.0"

# Only *.jinja files are rendered: GitHub Actions (${{ }}) shares Jinja's delimiters.
_templates_suffix: .jinja

_answers_file: .copier-answers.yml

# Project-owned once generated: /platform:update must not overwrite these.
_skip_if_exists:
  - .secrets.baseline.json    # repo-owned once created: it records the repo's own false positives (seeded when missing)
  - .claude/project-notes.md   # repo-owned notes, loaded by CLAUDE.md (spec 086)
  - README.md                # project-owned after creation (spec 060)
  - .github/ISSUE_TEMPLATE/**
  - package.json
  - pnpm-workspace.yaml
  - src/**
  - tests/**
  - docs/adr/**
  - docs/backlog.md
  - docs/plan/**
  - docs/specs/**

_exclude:
  - "copier.yml"
  - ".git"

_tasks:
  - "git init -q -b main"
  - "devbox install"
  - "devbox run -- pnpm install"
  - "git add -A && git -c user.email=bootstrap@ika100 -c user.name=bootstrap commit -q -m 'chore: bootstrap from library-typescript template'"
  - "echo 'Bootstrap complete. Repo committed at HEAD. Run: cd {{ project_name }} && devbox run quality'"

project_name:
  type: str
  help: "Project name (kebab-case, e.g. 'shared-types'). The npm package is @<github_org>/<project_name>."
  validator: >-
    {%- if not (project_name | regex_search('^[a-z][a-z0-9-]{1,39}$')) -%}
    project_name must match ^[a-z][a-z0-9-]{1,39}$
    {%- endif -%}

description:
  type: str
  help: "One-line description of the library."
  default: "A TypeScript library"

github_org:
  type: str
  help: "GitHub organization or user that will own the repo (and the npm scope, lowercased)."
  default: "ika100"

owner_team:
  type: str
  help: "Owning team or individual."
  default: "@{{ github_org }}"

node_major:
  type: str
  help: "Node.js major version (current Active LTS at template release; bumped via /platform:update — ADR-005)."
  default: "24"

platform_marketplace_ref:
  type: str
  help: "Git ref of ika100/sdlc-foundry to pin the plugin marketplace to (branch, tag, or commit)."
  default: "main"
