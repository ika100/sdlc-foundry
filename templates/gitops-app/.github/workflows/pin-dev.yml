name: pin-dev

# Spec 062 / ADR-027: every merge to a service's main pins dev to that build. The service's CI sends
# `repository_dispatch` (event pin-dev, payload {service, tag}); this workflow pins the tag on a branch and opens a PR.
# Spec 065 / ADR-028: it then runs ci.yml on that branch itself (a reusable-workflow call, so no runner waits on
# another) and merges the PR only when every check passed. That needs no branch protection or auto-merge, which
# private repos on GitHub Free do not have. A red CI leaves the PR open, comments the failed run, and dev keeps the
# old image. Where branch protection does require checks, the merge falls back to auto-merge after a CI run on the PR.
# Spec 144: a build that a system ship pins in its one dev PR (compose/<spec>) has a marker branch
# ship/<spec>/<service>-<sha7>; that build gets no PR here. Every other build is pinned as above.
run-name: pin-dev ${{ github.event.client_payload.service }} ${{ github.event.client_payload.tag }}   # spec 077: ship deploy finds this run by name
on:
  repository_dispatch:
    types: [pin-dev]

permissions:
  contents: write        # push the pin branch, merge the PR
  pull-requests: write   # open, close superseded, comment, merge
  actions: write         # dispatch ci.yml on the pin branch and approve its held PR runs (protected-branch fallback, #368)

concurrency:
  group: pin-dev-${{ github.event.client_payload.service }}
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      branch: ${{ steps.pin.outputs.branch }}
      pr: ${{ steps.pin.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Pin dev and open the PR
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ github.event.client_payload.service }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          [[ "$SERVICE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::invalid service '$SERVICE'"; exit 1; }
          [[ "$TAG" =~ ^sha-([0-9a-f]{40}|[0-9a-f]{7})$ ]] || { echo "::error::invalid tag '$TAG' (expected sha-<40 hex>)"; exit 1; }
          sha="${TAG#sha-}"
          if git ls-remote --heads origin | grep -q "refs/heads/ship/[^/]*/$SERVICE-${sha::7}$"; then   # spec 144
            echo "::notice::$SERVICE:$TAG is pinned by the system ship in its dev PR (marker ship/*/$SERVICE-${sha::7}): no pin PR of its own"
            exit 0
          fi
          uv run scripts/pin.py dev "$SERVICE" "$TAG"
          uv run scripts/render.py --check
          if git diff --quiet; then echo "::notice::dev already runs $SERVICE:$TAG"; exit 0; fi
          branch="pin/dev-$SERVICE-${sha::7}"   # the branch keeps the short sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit --signoff -am "chore(dev): pin $SERVICE to $TAG"
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "chore(dev): pin $SERVICE to $TAG" \
            --body "Automatic pin of a new build of \`$SERVICE\`'s main (spec 062). Merges itself when CI passes; if CI fails, dev keeps the previous image.")
          for old in $(gh pr list --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"pin/dev-$SERVICE-\")) | select(.headRefName != \"$branch\") | .number"); do
            gh pr close "$old" --delete-branch --comment "Superseded by $url" || true
          done
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=$url" >> "$GITHUB_OUTPUT"

  ci:
    needs: pin
    if: needs.pin.outputs.pr != ''
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.pin.outputs.branch }}

  merge:
    needs: [pin, ci]
    if: always() && needs.pin.outputs.pr != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Merge when CI passed, otherwise leave the PR open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.pin.outputs.pr }}
          BRANCH: ${{ needs.pin.outputs.branch }}
          CI_RESULT: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$CI_RESULT" != "success" ]; then
            gh pr comment "$PR" --body "CI on this pin ended with **$CI_RESULT** ($RUN_URL), so it was not merged and dev keeps the previous image. A newer build of the service supersedes this PR; or fix and merge it by hand."
            echo "::error::CI $CI_RESULT: $PR stays open, dev keeps the previous image"
            exit 1
          fi
          if gh pr merge "$PR" --squash --delete-branch; then
            echo "merged $PR after green CI"
            exit 0
          fi
          # Branch protection that requires checks from the PR itself (paid plans): run CI on the PR and let auto-merge wait.
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$PR" --auto --squash --delete-branch
          echo "::notice::branch protection requires PR checks: auto-merge is on for $PR"
          # Public repos (#368): GitHub holds the runs of a PR that github-actions[bot] opened until someone approves them,
          # so auto-merge would wait forever. Approve only this pin branch's pull_request runs at the commit this workflow pushed.
          if [ "$(gh api "repos/$GH_REPO" --jq .private)" = "false" ]; then
            sha=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
            runs() { gh api "repos/$GH_REPO/actions/runs?event=pull_request&head_sha=$sha" --jq ".workflow_runs[] | select(.head_branch == \"$BRANCH\") | $1"; }
            # Approve every held run as it appears (GitHub creates the runs of one PR seconds apart), until the PR's `ci` run
            # exists and runs; a `ci` run that failed at startup without a job blocks the merge forever (journey 2026-11-05).
            ci_ok() {
              id=$(runs 'select(.name == "ci" and .conclusion != "action_required") | .id' | head -1)
              [ -n "$id" ] && [ "$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq .total_count)" != "0" ]
            }
            approve_held() {
              for _ in $(seq 1 12); do
                for id in $(runs 'select(.conclusion == "action_required") | .id'); do
                  if gh api -X POST "repos/$GH_REPO/actions/runs/$id/approve" >/dev/null; then echo "approved held run $id of $PR"
                  else echo "::warning::could not approve run $id: approve it on $PR (Checks tab) so auto-merge can finish"; fi
                done
                ci_ok && return 0
                sleep 10
              done
              return 1
            }
            if ! approve_held; then
              # No `ci` run of the PR, or one that never started: close and reopen the PR so GitHub runs its checks again.
              echo "::notice::the ci run of $PR is missing or never started: reopening $PR to run its checks again"
              gh pr close "$PR" && gh pr reopen "$PR"
              gh pr merge "$PR" --auto --squash --delete-branch
              approve_held || echo "::warning::the ci run of $PR still did not run: close and reopen $PR by hand so auto-merge can finish"
            fi
          fi
