# Copier template: library-dotnet
# C# library published as the NuGet package `<Namespace>` to GitHub Packages on the release tag (spec 221, ADR-125): the
# pinned .NET LTS SDK via devbox (ADR-005), dotnet format and the .NET analyzers, xUnit + coverlet, trivy over the lock
# files — the service-dotnet template's tooling (ADR-127) without ASP.NET Core, the Dockerfile or the GitOps deployment.
#
# Usage:
#   copier copy <platform-checkout>/templates/library-dotnet ./<project> --data project_name=<name>

_min_copier_version: "9.0.0"

# Only *.jinja files are rendered: GitHub Actions (${{ }}) shares Jinja's delimiters.
_templates_suffix: .jinja

_answers_file: .copier-answers.yml

# Project-owned once generated: /platform:update must not overwrite these.
_skip_if_exists:
  - .secrets.baseline.json    # repo-owned once created: it records the repo's own false positives (seeded when missing)
  - .claude/project-notes.md   # repo-owned notes, loaded by CLAUDE.md (spec 086)
  - README.md                # project-owned after creation (spec 060)
  - .github/ISSUE_TEMPLATE/**
  - Directory.Packages.props
  - "*.slnx"
  - src/**
  - tests/**
  - docs/adr/**
  - docs/backlog.md
  - docs/plan/**
  - docs/specs/**

_exclude:
  - "copier.yml"
  - ".git"

_tasks:
  - "git init -q -b main"
  - "devbox install"
  - "devbox run -- dotnet restore"
  - "git add -A && git -c user.email=bootstrap@ika100 -c user.name=bootstrap commit -q -m 'chore: bootstrap from library-dotnet template'"
  - "echo 'Bootstrap complete. Repo committed at HEAD. Run: cd {{ project_name }} && devbox run quality'"

project_name:
  type: str
  help: "Project name (kebab-case, e.g. 'shared-utils'). Its PascalCase form is the C# namespace and the NuGet PackageId."
  validator: >-
    {%- if not (project_name | regex_search('^[a-z][a-z0-9-]{1,39}$')) -%}
    project_name must match ^[a-z][a-z0-9-]{1,39}$
    {%- endif -%}

namespace:
  type: str
  when: false
  default: "{{ project_name | replace('-', ' ') | title | replace(' ', '') }}"

description:
  type: str
  help: "One-line description of the library (the package description)."
  default: "A .NET library"

github_org:
  type: str
  help: "GitHub organization or user that will own the repo (and the GitHub Packages registry it publishes to)."
  default: "ika100"

owner_team:
  type: str
  help: "Owning team or individual."
  default: "@{{ github_org }}"

dotnet_major:
  type: str
  help: ".NET major version (LTS; the target framework net<major>.0 and the devbox SDK; bumped via /platform:update — ADR-005). Consumers need this .NET or newer."
  default: "10"

dotnet_sdk_version:
  type: str
  when: false
  default: "10.0.403"   # the devbox SDK of dotnet_major (scripts/bump_template_pins.py moves it); = templates/service-dotnet

platform_marketplace_ref:
  type: str
  help: "Git ref of ika100/sdlc-foundry to pin the plugin marketplace to (branch, tag, or commit)."
  default: "main"
